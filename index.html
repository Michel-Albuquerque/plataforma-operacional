<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plataforma Operacional RJ</title>
  <style>
    :root{--blue:#0057B8;--blue-dark:#003B7A;--yellow:#FFD100;--green:#2DBE60;--bg:#F4F6F8;--surface:#fff;--text:#172033;--muted:#667085;--border:#D9E0E7;--shadow:0 12px 28px rgba(16,24,40,.10);--side:250px;--side-mini:76px;--top:64px}
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}
    .app{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:var(--top) 1fr;height:100vh;transition:grid-template-columns .22s ease}.app.collapsed{grid-template-columns:var(--side-mini) 1fr}
    .sidebar{grid-row:1/3;grid-column:1;display:flex;flex-direction:column;min-width:0;background:linear-gradient(180deg,var(--blue-dark),#082B52);color:#fff;box-shadow:8px 0 24px rgba(0,33,71,.14);z-index:5}
    .brand{height:var(--top);display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.12);overflow:hidden;white-space:nowrap}.mark{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--yellow) 0 33%,var(--green) 33% 66%,#4EA5FF 66%);color:#0B2B4A;font-weight:900;box-shadow:0 8px 18px rgba(0,0,0,.16)}
    .brand-title{font-size:.98rem;font-weight:750}.brand-sub{margin-top:2px;font-size:.68rem;color:rgba(255,255,255,.66)}
    .menu{display:flex;flex-direction:column;gap:8px;padding:18px 12px;overflow-y:auto}.menu-label{padding:2px 10px 6px;color:rgba(255,255,255,.5);font-size:.62rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
    .nav-item{width:100%;min-height:46px;display:flex;align-items:center;gap:13px;padding:0 12px;border:1px solid transparent;border-radius:12px;background:transparent;color:rgba(255,255,255,.82);cursor:pointer;text-align:left;transition:.16s;overflow:hidden;white-space:nowrap}.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}.nav-item.active{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.16);color:#fff;box-shadow:inset 3px 0 0 var(--yellow)}
    .nav-icon{width:24px;flex:0 0 24px;display:grid;place-items:center;font-size:1.05rem}.nav-text{overflow:hidden;text-overflow:ellipsis;font-size:.82rem;font-weight:650}
    .sidebar-footer{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.1)}.status-card{padding:12px;border-radius:12px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.78);font-size:.66rem;white-space:nowrap;overflow:hidden}.dot{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(45,190,96,.15)}
    .topbar{grid-column:2;grid-row:1;display:flex;align-items:center;gap:14px;padding:0 18px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);box-shadow:0 4px 16px rgba(16,24,40,.05);z-index:4}.icon-btn{width:40px;height:40px;display:grid;place-items:center;flex:0 0 40px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--blue-dark);cursor:pointer}.icon-btn:hover{border-color:#A9B7C6;background:#F8FAFC}.page-heading{min-width:0;flex:1}.page-title{margin:0;font-size:1rem;font-weight:760;color:#18304E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.page-subtitle{margin-top:2px;font-size:.68rem;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:9px}.pill{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:#fff;color:#526174;font-size:.68rem;font-weight:650}
    .content{grid-column:2;grid-row:2;position:relative;min-width:0;min-height:0;padding:10px;background:radial-gradient(circle at 100% 0%,rgba(0,87,184,.05),transparent 30%),var(--bg)}.viewer-shell{width:100%;height:100%;overflow:hidden;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:var(--shadow)}iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .loading{position:absolute;inset:10px;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;border-radius:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);z-index:3}.loading.show{display:flex}.spinner{width:34px;height:34px;border:4px solid #DFE6ED;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .app.collapsed .brand-text,.app.collapsed .nav-text,.app.collapsed .menu-label,.app.collapsed .status-card span:not(.dot){opacity:0;pointer-events:none}.app.collapsed .brand,.app.collapsed .nav-item{justify-content:center;padding-left:0;padding-right:0}.app.collapsed .menu{padding-left:10px;padding-right:10px}.app.collapsed .status-card{text-align:center;padding:12px 6px}
    @media(max-width:780px){.app{grid-template-columns:var(--side-mini) 1fr}.brand-text,.nav-text,.menu-label,.status-card span:not(.dot){display:none}.brand,.nav-item{justify-content:center;padding-left:0;padding-right:0}.pill{display:none}.content{padding:6px}.loading{inset:6px}}
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand"><div class="mark">E</div><div class="brand-text"><div class="brand-title">Plataforma Operacional</div><div class="brand-sub">Enel RJ</div></div></div>
      <nav class="menu">
        <div class="menu-label">Análises</div>
        <button class="nav-item active" data-file="Ao_Vivo.html" data-title="Ao Vivo" data-subtitle="Acompanhamento operacional em tempo real"><span class="nav-icon">◉</span><span class="nav-text">Ao Vivo</span></button>
        <button class="nav-item" data-file="Ranking.html" data-title="Ranking" data-subtitle="Indicadores e desempenho operacional"><span class="nav-icon">▥</span><span class="nav-text">Ranking</span></button>
        <button class="nav-item" data-file="Tempo_Plataforma.html" data-title="Tempo de Plataforma" data-subtitle="Análise dos tempos e etapas da operação"><span class="nav-icon">◷</span><span class="nav-text">Tempo de Plataforma</span></button>
        <button class="nav-item" data-file="Reincidencia.html" data-title="Reincidência" data-subtitle="Análise de clientes e casos reincidentes"><span class="nav-icon">↻</span><span class="nav-text">Reincidência</span></button>
      </nav>
      <div class="sidebar-footer"><div class="status-card"><span class="dot"></span><span>Plataforma disponível</span></div></div>
    </aside>
    <header class="topbar">
      <button class="icon-btn" id="toggleSidebar" title="Minimizar ou expandir menu">☰</button>
      <div class="page-heading"><h1 class="page-title" id="pageTitle">Ao Vivo</h1><div class="page-subtitle" id="pageSubtitle">Acompanhamento operacional em tempo real</div></div>
      <div class="top-actions"><div class="pill"><span class="dot"></span>Plataforma disponível</div><button class="icon-btn" id="refreshFrame" title="Atualizar painel">↻</button><button class="icon-btn" id="openNewTab" title="Abrir painel em nova aba">↗</button></div>
    </header>
    <main class="content">
      <div class="loading" id="loading"><div class="spinner"></div><div>Carregando painel...</div></div>
      <div class="viewer-shell"><iframe id="viewer" src="Ao_Vivo.html" title="Painel operacional"></iframe></div>
    </main>
  </div>
  <script>
    const app=document.getElementById('app'),viewer=document.getElementById('viewer'),loading=document.getElementById('loading'),pageTitle=document.getElementById('pageTitle'),pageSubtitle=document.getElementById('pageSubtitle'),navItems=[...document.querySelectorAll('.nav-item')];
    let currentFile='Ao_Vivo.html';
    const setLoading=v=>loading.classList.toggle('show',v);
    function openPanel(button){currentFile=button.dataset.file;pageTitle.textContent=button.dataset.title;pageSubtitle.textContent=button.dataset.subtitle;navItems.forEach(i=>i.classList.remove('active'));button.classList.add('active');setLoading(true);viewer.src=currentFile;sessionStorage.setItem('painelAtual',currentFile)}
    navItems.forEach(b=>b.addEventListener('click',()=>openPanel(b)));viewer.addEventListener('load',()=>setLoading(false));
    document.getElementById('toggleSidebar').addEventListener('click',()=>{app.classList.toggle('collapsed');localStorage.setItem('sidebarCollapsed',app.classList.contains('collapsed')?'1':'0')});
    document.getElementById('refreshFrame').addEventListener('click',()=>{setLoading(true);try{viewer.contentWindow.location.reload()}catch(e){viewer.src=currentFile}});
    document.getElementById('openNewTab').addEventListener('click',()=>window.open(currentFile,'_blank'));
    if(localStorage.getItem('sidebarCollapsed')==='1')app.classList.add('collapsed');
    const saved=sessionStorage.getItem('painelAtual');if(saved){const target=navItems.find(i=>i.dataset.file===saved);if(target)openPanel(target)}
  </script>
</body>
</html>
