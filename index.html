<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  />

  <meta
    http-equiv="Pragma"
    content="no-cache"
  />

  <meta
    http-equiv="Expires"
    content="0"
  />

  <title>Plataforma Operacional RJ</title>

  <style>
    :root {
      --blue: #0057B8;
      --blue-dark: #003B7A;
      --yellow: #FFD100;
      --green: #2DBE60;
      --bg: #F4F6F8;
      --surface: #FFFFFF;
      --text: #172033;
      --muted: #667085;
      --border: #D9E0E7;
      --shadow: 0 12px 28px rgba(16, 24, 40, 0.10);
      --side: 250px;
      --side-mini: 76px;
      --top: 64px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button,
    input {
      font-family: inherit;
    }

    /* =========================================================
       ESTRUTURA PRINCIPAL
    ========================================================= */

    .app {
      display: grid;
      grid-template-columns: var(--side) 1fr;
      grid-template-rows: var(--top) 1fr;
      width: 100%;
      height: 100vh;
      transition: grid-template-columns 0.22s ease;
    }

    .app.collapsed {
      grid-template-columns: var(--side-mini) 1fr;
    }

    /* =========================================================
       MENU LATERAL
    ========================================================= */

    .sidebar {
      grid-row: 1 / 3;
      grid-column: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      color: #FFFFFF;
      background:
        linear-gradient(
          180deg,
          var(--blue-dark),
          #082B52
        );
      box-shadow:
        8px 0 24px rgba(0, 33, 71, 0.14);
      z-index: 5;
    }

    .brand {
      height: var(--top);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      border-bottom:
        1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
      white-space: nowrap;
    }

    .mark {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background:
        linear-gradient(
          135deg,
          var(--yellow) 0 33%,
          var(--green) 33% 66%,
          #4EA5FF 66%
        );
      color: #0B2B4A;
      font-weight: 900;
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.16);
    }

    .brand-title {
      font-size: 0.98rem;
      font-weight: 750;
    }

    .brand-sub {
      margin-top: 2px;
      font-size: 0.68rem;
      color: rgba(255, 255, 255, 0.66);
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 18px 12px;
      overflow-y: auto;
    }

    .menu-label {
      padding: 2px 10px 6px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .nav-item {
      width: 100%;
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: rgba(255, 255, 255, 0.82);
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      white-space: nowrap;
      transition:
        background 0.16s ease,
        border-color 0.16s ease,
        color 0.16s ease;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.16);
      color: #FFFFFF;
      box-shadow:
        inset 3px 0 0 var(--yellow);
    }

    .nav-icon {
      width: 24px;
      flex: 0 0 24px;
      display: grid;
      place-items: center;
      font-size: 1.05rem;
    }

    .nav-text {
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.82rem;
      font-weight: 650;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 12px;
      border-top:
        1px solid rgba(255, 255, 255, 0.1);
    }

    .status-card {
      padding: 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.66rem;
      white-space: nowrap;
      overflow: hidden;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow:
        0 0 0 4px rgba(45, 190, 96, 0.15);
    }

    /* =========================================================
       BARRA SUPERIOR
    ========================================================= */

    .topbar {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--border);
      box-shadow:
        0 4px 16px rgba(16, 24, 40, 0.05);
      z-index: 4;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 40px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #FFFFFF;
      color: var(--blue-dark);
      font-size: 1rem;
      cursor: pointer;
      transition:
        background 0.16s ease,
        border-color 0.16s ease;
    }

    .icon-btn:hover {
      border-color: #A9B7C6;
      background: #F8FAFC;
    }

    .page-heading {
      min-width: 0;
      flex: 1;
    }

    .page-title {
      margin: 0;
      color: #18304E;
      font-size: 1rem;
      font-weight: 760;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .page-subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .pill {
      height: 36px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #FFFFFF;
      color: #526174;
      font-size: 0.68rem;
      font-weight: 650;
    }

    /* =========================================================
       ÁREA DO PAINEL
    ========================================================= */

    .content {
      grid-column: 2;
      grid-row: 2;
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: 10px;
      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(0, 87, 184, 0.05),
          transparent 30%
        ),
        var(--bg);
    }

    .viewer-shell {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #FFFFFF;
      box-shadow: var(--shadow);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #FFFFFF;
    }

    /* =========================================================
       CARREGAMENTO
    ========================================================= */

    .loading {
      position: absolute;
      inset: 10px;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      z-index: 3;
    }

    .loading.show {
      display: flex;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid #DFE6ED;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       MENU RECOLHIDO
    ========================================================= */

    .app.collapsed .brand-text,
    .app.collapsed .nav-text,
    .app.collapsed .menu-label,
    .app.collapsed .status-card span:not(.dot) {
      opacity: 0;
      pointer-events: none;
    }

    .app.collapsed .brand,
    .app.collapsed .nav-item {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }

    .app.collapsed .menu {
      padding-left: 10px;
      padding-right: 10px;
    }

    .app.collapsed .status-card {
      padding: 12px 6px;
      text-align: center;
    }

    /* =========================================================
       LOGIN
    ========================================================= */

    .login-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background:
        radial-gradient(
          circle at 85% 10%,
          rgba(0, 87, 184, 0.32),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #003B7A,
          #082B52
        );
    }

    .login-screen.hidden {
      display: none;
    }

    .login-box {
      width: min(390px, 100%);
      padding: 34px;
      border-radius: 20px;
      background: #FFFFFF;
      text-align: center;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.30);
    }

    .login-logo-wrap {
      display: flex;
      justify-content: center;
      margin: 0 auto 18px;
    }

    .login-logo {
      display: block;
      width: 100%;
      max-width: 250px;
      height: auto;
      object-fit: contain;
    }

    .login-box h1 {
      margin: 0;
      color: #18304E;
      font-size: 1.28rem;
      font-weight: 800;
    }

    .login-city {
      margin: 7px 0 24px;
      color: var(--blue);
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .login-field {
      position: relative;
      margin-bottom: 12px;
    }

    .login-box input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #D9E0E7;
      border-radius: 11px;
      font-size: 0.88rem;
      outline: none;
    }

    .login-box input:focus {
      border-color: var(--blue);
      box-shadow:
        0 0 0 3px rgba(0, 87, 184, 0.12);
    }

    .login-box button {
      width: 100%;
      height: 46px;
      margin-top: 5px;
      border: 0;
      border-radius: 11px;
      background: var(--blue);
      color: #FFFFFF;
      font-weight: 700;
      cursor: pointer;
    }

    .login-box button:hover {
      background: var(--blue-dark);
    }

    #loginError {
      display: none;
      margin-top: 13px;
      color: #B42318;
      font-size: 0.75rem;
    }

    .login-note {
      margin-top: 15px;
      color: #98A2B3;
      font-size: 0.66rem;
      line-height: 1.4;
    }

    /* =========================================================
       RESPONSIVIDADE
    ========================================================= */

    @media (max-width: 780px) {
      .app {
        grid-template-columns: var(--side-mini) 1fr;
      }

      .brand-text,
      .nav-text,
      .menu-label,
      .status-card span:not(.dot) {
        display: none;
      }

      .brand,
      .nav-item {
        justify-content: center;
        padding-left: 0;
        padding-right: 0;
      }

      .pill {
        display: none;
      }

      .content {
        padding: 6px;
      }

      .loading {
        inset: 6px;
      }
    }
  </style>
</head>

<body>
  <!-- =======================================================
       TELA DE LOGIN
  ======================================================== -->

  <div
    id="loginScreen"
    class="login-screen"
  >
    <div class="login-box">
      <div class="login-logo-wrap">
        <img
          src="logo_enel.png"
          alt="Enel Brasil"
          class="login-logo"
        />
      </div>

      <h1>Plataforma Operacional</h1>

      <div class="login-city">
        São Gonçalo
      </div>

      <div class="login-field">
        <input
          type="text"
          id="loginUser"
          placeholder="Usuário"
          autocomplete="username"
        />
      </div>

      <div class="login-field">
        <input
          type="password"
          id="loginPassword"
          placeholder="Senha"
          autocomplete="current-password"
        />
      </div>

      <button
        id="loginButton"
        type="button"
      >
        Entrar
      </button>

      <div id="loginError">
        Usuário ou senha inválidos.
      </div>

      <div class="login-note">
        Esta autenticação é apenas uma barreira visual
        em página estática.
      </div>
    </div>
  </div>

  <!-- =======================================================
       PLATAFORMA
  ======================================================== -->

  <div
    class="app"
    id="app"
  >
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">
          E
        </div>

        <div class="brand-text">
          <div class="brand-title">
            Plataforma Operacional
          </div>

          <div class="brand-sub">
            São Gonçalo
          </div>
        </div>
      </div>

      <nav class="menu">
        <div class="menu-label">
          Análises
        </div>

        <button
          type="button"
          class="nav-item active"
          data-file="Ao_Vivo.html"
          data-title="Ao Vivo"
          data-subtitle="Acompanhamento operacional em tempo real"
        >
          <span class="nav-icon">
            ◉
          </span>

          <span class="nav-text">
            Ao Vivo
          </span>
        </button>

        <button
          type="button"
          class="nav-item"
          data-file="Ranking.html"
          data-title="Ranking"
          data-subtitle="Indicadores e desempenho operacional"
        >
          <span class="nav-icon">
            ▥
          </span>

          <span class="nav-text">
            Ranking
          </span>
        </button>

        <button
          type="button"
          class="nav-item"
          data-file="Tempo_Plataforma.html"
          data-title="Tempo de Plataforma"
          data-subtitle="Análise dos tempos e etapas da operação"
        >
          <span class="nav-icon">
            ◷
          </span>

          <span class="nav-text">
            Tempo de Plataforma
          </span>
        </button>

        <button
          type="button"
          class="nav-item"
          data-file="http://127.0.0.1:8024/plataforma_operacional_integrada_v7.html?tab=dashboard&amp;embedded=1"
          data-title="Reincidência"
          data-subtitle="Visão gerencial de clientes, equipes, causas e reincidências"
        >
          <span class="nav-icon">
            ↻
          </span>

          <span class="nav-text">
            Reincidência
          </span>
        </button>
        <button
          type="button"
          class="nav-item"
          data-file="http://127.0.0.1:8024/plataforma_operacional_integrada_v7.html?tab=validacaoPos&amp;embedded=1"
          data-title="Validação Pós-Atendimento"
          data-subtitle="Contato com o cliente e efetividade pós-atendimento"
        >
          <span class="nav-icon">✓</span>
          <span class="nav-text">Validação Pós-Atendimento</span>
        </button>

        <button
          type="button"
          class="nav-item"
          data-file="http://127.0.0.1:8024/plataforma_operacional_integrada_v7.html?tab=callbackContingencia&amp;embedded=1"
          data-title="Callback Contingência"
          data-subtitle="Carteira ativa, contatos e confirmação do fornecimento"
        >
          <span class="nav-icon">☎</span>
          <span class="nav-text">Callback Contingência</span>
        </button>

        <button
          class="nav-item"
          data-file="Emergencia.html"
          data-title="Gestão da Emergência"
          data-subtitle="Visão executiva, Tempo Real, incidências e TMA"
        >
          <span class="nav-icon">⚡</span>
          <span class="nav-text">Emergência</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="status-card">
          <span class="dot"></span>

          <span>
            Plataforma disponível
          </span>
        </div>
      </div>
    </aside>

    <header class="topbar">
      <button
        type="button"
        class="icon-btn"
        id="toggleSidebar"
        title="Minimizar ou expandir menu"
      >
        ☰
      </button>

      <div class="page-heading">
        <h1
          class="page-title"
          id="pageTitle"
        >
          Ao Vivo
        </h1>

        <div
          class="page-subtitle"
          id="pageSubtitle"
        >
          Acompanhamento operacional em tempo real
        </div>
      </div>

      <div class="top-actions">
        <div class="pill">
          <span class="dot"></span>

          Plataforma disponível
        </div>

        <button
          type="button"
          class="icon-btn"
          id="refreshFrame"
          title="Atualizar painel"
        >
          ↻
        </button>

        <button
          type="button"
          class="icon-btn"
          id="openNewTab"
          title="Abrir painel em nova aba"
        >
          ↗
        </button>
      </div>
    </header>

    <main class="content">
      <div
        class="loading"
        id="loading"
      >
        <div class="spinner"></div>

        <div>
          Carregando painel...
        </div>
      </div>

      <div class="viewer-shell">
        <iframe
          id="viewer"
          src="about:blank"
          title="Painel operacional"
        ></iframe>
      </div>
    </main>
  </div>

  <script>
    /* =======================================================
       ELEMENTOS DA PLATAFORMA
    ======================================================== */

    const app =
      document.getElementById('app');

    const viewer =
      document.getElementById('viewer');

    const loading =
      document.getElementById('loading');

    const pageTitle =
      document.getElementById('pageTitle');

    const pageSubtitle =
      document.getElementById('pageSubtitle');

    const navItems = [
      ...document.querySelectorAll('.nav-item')
    ];

    let currentFile = 'Ao_Vivo.html';

    /* =======================================================
       CONTROLE DE CARREGAMENTO
    ======================================================== */

    function setLoading(visible) {
      loading.classList.toggle(
        'show',
        visible
      );
    }

    /* =======================================================
       FUNÇÃO ANTICACHE
    ======================================================== */

    function criarUrlAtualizada(arquivo) {
      const separador =
        arquivo.includes('?') ? '&' : '?';

      return (
        arquivo +
        separador +
        'v=' +
        Date.now()
      );
    }

    /* =======================================================
       CARREGAR PAINEL
    ======================================================== */

    function carregarPainel(arquivo) {
      setLoading(true);

      viewer.src =
        criarUrlAtualizada(arquivo);
    }

    /* =======================================================
       ABRIR ITEM DO MENU
    ======================================================== */

    function openPanel(button) {
      currentFile =
        button.dataset.file;

      pageTitle.textContent =
        button.dataset.title;

      pageSubtitle.textContent =
        button.dataset.subtitle;

      navItems.forEach(item => {
        item.classList.remove('active');
      });

      button.classList.add('active');

      carregarPainel(currentFile);

      sessionStorage.setItem(
        'painelAtual',
        currentFile
      );
    }

    navItems.forEach(button => {
      button.addEventListener(
        'click',
        () => openPanel(button)
      );
    });

    viewer.addEventListener(
      'load',
      () => {
        setLoading(false);
      }
    );

    /* =======================================================
       MENU LATERAL
    ======================================================== */

    document
      .getElementById('toggleSidebar')
      .addEventListener(
        'click',
        () => {
          app.classList.toggle(
            'collapsed'
          );

          localStorage.setItem(
            'sidebarCollapsed',
            app.classList.contains(
              'collapsed'
            )
              ? '1'
              : '0'
          );
        }
      );

    /* =======================================================
       BOTÃO ATUALIZAR
    ======================================================== */

    document
      .getElementById('refreshFrame')
      .addEventListener(
        'click',
        () => {
          carregarPainel(currentFile);
        }
      );

    /* =======================================================
       ABRIR EM NOVA ABA
    ======================================================== */

    document
      .getElementById('openNewTab')
      .addEventListener(
        'click',
        () => {
          window.open(
            criarUrlAtualizada(
              currentFile
            ),
            '_blank'
          );
        }
      );

    /* =======================================================
       RESTAURAR ESTADO DO MENU
    ======================================================== */

    if (
      localStorage.getItem(
        'sidebarCollapsed'
      ) === '1'
    ) {
      app.classList.add('collapsed');
    }

    /* =======================================================
       RESTAURAR ÚLTIMO PAINEL
    ======================================================== */

    const saved =
      sessionStorage.getItem(
        'painelAtual'
      );

    if (saved) {
      const target =
        navItems.find(
          item =>
            item.dataset.file === saved
        );

      if (target) {
        openPanel(target);
      } else {
        carregarPainel(currentFile);
      }
    } else {
      carregarPainel(currentFile);
    }

    /* =======================================================
       CREDENCIAIS
    ======================================================== */

    const LOGIN_USUARIO =
      'admin';

    const LOGIN_SENHA =
      'adminadmin';

    /* =======================================================
       ELEMENTOS DO LOGIN
    ======================================================== */

    const loginScreen =
      document.getElementById(
        'loginScreen'
      );

    const loginUser =
      document.getElementById(
        'loginUser'
      );

    const loginPassword =
      document.getElementById(
        'loginPassword'
      );

    const loginButton =
      document.getElementById(
        'loginButton'
      );

    const loginError =
      document.getElementById(
        'loginError'
      );

    /* =======================================================
       REALIZAR LOGIN
    ======================================================== */

    function realizarLogin() {
      const usuarioCorreto =
        loginUser.value ===
        LOGIN_USUARIO;

      const senhaCorreta =
        loginPassword.value ===
        LOGIN_SENHA;

      if (
        usuarioCorreto &&
        senhaCorreta
      ) {
        sessionStorage.setItem(
          'plataformaAutenticada',
          '1'
        );

        loginScreen.classList.add(
          'hidden'
        );

        loginError.style.display =
          'none';

        loginPassword.value = '';
      } else {
        loginError.style.display =
          'block';

        loginPassword.value = '';

        loginPassword.focus();
      }
    }

    /* =======================================================
       VERIFICAR SESSÃO
    ======================================================== */

    if (
      sessionStorage.getItem(
        'plataformaAutenticada'
      ) === '1'
    ) {
      loginScreen.classList.add(
        'hidden'
      );
    } else {
      setTimeout(
        () => loginUser.focus(),
        100
      );
    }

    /* =======================================================
       EVENTOS DO LOGIN
    ======================================================== */

    loginButton.addEventListener(
      'click',
      realizarLogin
    );

    loginUser.addEventListener(
      'keydown',
      event => {
        if (event.key === 'Enter') {
          loginPassword.focus();
        }
      }
    );

    loginPassword.addEventListener(
      'keydown',
      event => {
        if (event.key === 'Enter') {
          realizarLogin();
        }
      }
    );
  </script>
</body>
</html>
